backend:
  name: github
  repo: CUFERROUS/Ferrous
  branch: main

media_folder: "media"
public_folder: "/media"

collections:
  - name: "projects"
    label: "Projects"
    files:
      - name: "entries"
        label: "Project entries"
        file: "data/projects.json"
        fields:
          - { label: "Entries", name: "entries", widget: "list", fields: [
              { label: "Name", name: "name", widget: "string" },
              { label: "Repo URL", name: "url", widget: "string" },
              { label: "Description", name: "description", widget: "text" }
            ]}

  - name: "journal"
    label: "Journal"
    files:
      - name: "entries"
        label: "Journal entries"
        file: "data/journal.json"
        fields:
          - { label: "Entries", name: "entries", widget: "list", fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Date", name: "date", widget: "string", hint: "e.g. Sep 2026" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Link", name: "link", widget: "string", default: "#", required: false }
            ]}

  - name: "tutorials"
    label: "Tutorials"
    files:
      - name: "entries"
        label: "Tutorial entries"
        file: "data/tutorials.json"
        fields:
          - { label: "Entries", name: "entries", widget: "list", fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Date", name: "date", widget: "string", hint: "e.g. Sep 2026" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Link", name: "link", widget: "string", default: "#", required: false }
            ]}

  - name: "links"
    label: "Links"
    files:
      - name: "entries"
        label: "Contact & social links"
        file: "data/links.json"
        fields:
          - { label: "Entries", name: "entries", widget: "list", fields: [
              { label: "Label", name: "label", widget: "string", hint: "e.g. GitHub, Email, Twitter" },
              { label: "URL", name: "url", widget: "string", hint: "Use mailto:you@example.com for email" }
            ]}

  - name: "guestbook"
    label: "Guestbook"
    files:
      - name: "entries"
        label: "Guestbook entries"
        file: "data/guestbook.json"
        fields:
          - { label: "Entries", name: "entries", widget: "list", fields: [
              { label: "Name", name: "name", widget: "string" },
              { label: "Message", name: "message", widget: "text" },
              { label: "Date", name: "date", widget: "string", hint: "e.g. Sep 2026" }
            ]}

  - name: "notes"
    label: "Notes"
    files:
      - name: "entries"
        label: "Note entries"
        file: "data/notes.json"
        fields:
          - { label: "Entries", name: "entries", widget: "list", fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Date", name: "date", widget: "string", hint: "e.g. Sep 2026" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Link", name: "link", widget: "string", default: "#", required: false }
            ]}
