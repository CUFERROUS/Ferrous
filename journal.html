<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrous — Journal</title>
<link rel="alternate" type="application/rss+xml" title="Ferrous Journal" href="feed.xml">
<style>
  :root {
    --ink: #F5E9DA;
    --ink-soft: #E0C9AE;
    --copper: #F0A868;
    --rust: #D9782A;
    --line: rgba(255,255,255,0.22);
  }

  * { box-sizing: border-box; }

  html { background-color: #140b06; }

  body {
    margin: 0;
    background-image: url('ferrous-bg.jpg');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-position: top center;
    background-color: #140b06;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
  }

  .site-nav {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .site-nav a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .site-nav a:hover, .site-nav a.active { color: var(--copper); }

  .back-link {
    display: inline-block;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 2rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .back-link:hover { color: var(--copper); }

  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 2.5rem;
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 2px 8px rgba(0,0,0,0.55);
    margin: 0 0 0.4rem;
  }

  .underline {
    width: 140px;
    height: 3px;
    background: var(--rust);
    margin: 0.6rem 0 2.5rem;
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2rem;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-family: inherit;
    padding: 0.6rem 0.2rem;
    margin-right: 1.5rem;
    cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    border-bottom: 2px solid transparent;
  }

  .tab-btn:hover { color: var(--ink); }

  .tab-btn.active {
    color: var(--ink);
    border-bottom: 2px solid var(--copper);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .index { border-top: 1px solid var(--line); }

  .entry {
    display: block;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }

  .entry:hover .entry-name { color: var(--copper); }

  .entry-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }

  .entry-name {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .entry-date {
    color: var(--copper);
    font-size: 0.85rem;
    flex-shrink: 0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .entry-desc {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin-top: 0.3rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .empty {
    color: var(--ink-soft);
    font-size: 0.95rem;
    padding: 1.5rem 0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  footer {
    margin-top: 3rem;
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  footer a { color: var(--copper); }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="journal.html" class="active">Journal</a>
      <a href="suggestions.html">Suggestions</a>
      <a href="guestbook.html">Guestbook</a>
      <a href="feed.xml" style="margin-left: auto;">RSS &rarr;</a>
    </nav>

    <h1>Journal</h1>
    <div class="underline"></div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="journal" role="tab" aria-selected="true">Journal</button>
      <button class="tab-btn" data-tab="tutorials" role="tab" aria-selected="false">Tutorials</button>
      <button class="tab-btn" data-tab="notes" role="tab" aria-selected="false">Notes</button>
    </div>

    <div class="panel active" id="panel-journal">
      <div class="index" id="list-journal"></div>
    </div>

    <div class="panel" id="panel-tutorials">
      <div class="index" id="list-tutorials"></div>
    </div>

    <div class="panel" id="panel-notes">
      <div class="index" id="list-notes"></div>
    </div>

    <footer>
      Built and maintained by <a href="https://github.com/CUFERROUS">CUFERROUS</a>.
    </footer>
  </div>

  <script>
    const buttons = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.panel');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
        panels.forEach(p => p.classList.remove('active'));

        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function renderEntries(containerId, entries) {
      const container = document.getElementById(containerId);
      if (!entries || entries.length === 0) {
        container.innerHTML = '<div class="empty">Nothing here yet.</div>';
        return;
      }
      container.innerHTML = entries.map(e => `
        <a class="entry" href="${e.link || '#'}">
          <div class="entry-row">
            <span class="entry-name">${e.title}</span>
            <span class="entry-date">${e.date}</span>
          </div>
          <p class="entry-desc">${e.description}</p>
        </a>
      `).join('');
    }

    async function loadData(file, containerId) {
      try {
        const res = await fetch(file + '?t=' + Date.now());
        const json = await res.json();
        renderEntries(containerId, json.entries);
      } catch (err) {
        document.getElementById(containerId).innerHTML = '<div class="empty">Couldn\'t load entries.</div>';
      }
    }

    loadData('data/journal.json', 'list-journal');
    loadData('data/tutorials.json', 'list-tutorials');
    loadData('data/notes.json', 'list-notes');
  </script>
</body>
</html>
