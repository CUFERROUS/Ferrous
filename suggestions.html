<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrous — Suggestions</title>
<link rel="canonical" href="https://cuferrous.github.io/Ferrous/suggestions.html">
<style>
  :root {
    --ink: #F5E9DA;
    --ink-soft: #E0C9AE;
    --copper: #F0A868;
    --rust: #D9782A;
    --line: rgba(255,255,255,0.22);
  }
  * { box-sizing: border-box; }
  html { background-color: #140b06; }
  body {
    margin: 0;
    background-image: url('ferrous-bg.jpg');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-position: top center;
    background-color: #140b06;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .site-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 1.5rem;
    margin-bottom: 2.5rem;
  }
  @media (max-width: 480px) {
    .wrap { padding: 3rem 1.2rem 3rem; }
    h1 { font-size: 2rem; }
  }
  .site-nav a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .site-nav a:hover, .site-nav a.active { color: var(--copper); }
  .back-link {
    display: inline-block;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 2rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .back-link:hover { color: var(--copper); }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 2.5rem;
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 2px 8px rgba(0,0,0,0.55);
    margin: 0 0 0.4rem;
  }
  .underline { width: 140px; height: 3px; background: var(--rust); margin: 0.6rem 0 1.5rem; }
  .intro {
    color: var(--ink-soft);
    font-size: 1rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    max-width: 46ch;
    margin: 0 0 2.5rem;
  }
  label {
    display: block;
    font-size: 0.9rem;
    color: var(--ink-soft);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    margin-bottom: 0.4rem;
  }
  input, textarea {
    width: 100%;
    background: rgba(20,11,6,0.55);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.7rem 0.8rem;
    margin-bottom: 1.4rem;
  }
  textarea { resize: vertical; min-height: 120px; }
  input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: 0.6; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--copper);
  }
  button {
    background: var(--rust);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.7rem 1.6rem;
    cursor: pointer;
  }
  button:hover { background: var(--copper); }
  button:disabled { opacity: 0.6; cursor: default; }
  .status {
    margin-top: 1.2rem;
    font-size: 0.9rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .status.success { color: #B7D9A8; }
  .status.error { color: #E29A8A; }
  footer {
    margin-top: 4rem;
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  footer a { color: var(--copper); }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="journal.html">Journal</a>
      <a href="tools.html">Tools</a>
      <a href="suggestions.html" class="active">Suggestions</a>
      <a href="guestbook.html">Guestbook</a>
    </nav>

    <h1>Suggestions</h1>
    <div class="underline"></div>
    <p class="intro">Got an idea, a bug, or something you think should be different? Drop it here — it goes straight to me.</p>

    <form id="suggestion-form">
      <input type="hidden" name="access_key" value="b7b6294b-d998-4c3f-af4d-d647aff2c884">
      <input type="hidden" name="subject" value="New suggestion from Ferrous">

      <label for="name">Name (optional)</label>
      <input type="text" id="name" name="name" placeholder="Your name">

      <label for="message">Suggestion</label>
      <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>

      <button type="submit" id="submit-btn">Send suggestion</button>
      <div id="form-status" class="status"></div>
    </form>

    <footer>
      Built and maintained by <a href="https://github.com/CUFERROUS">CUFERROUS</a>.
    </footer>
  </div>

  <script>
    const form = document.getElementById('suggestion-form');
    const statusEl = document.getElementById('form-status');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending...';
      statusEl.textContent = '';
      statusEl.className = 'status';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const result = await res.json();

        if (result.success) {
          statusEl.textContent = 'Thanks — that\'s been sent.';
          statusEl.classList.add('success');
          form.reset();
        } else {
          throw new Error(result.message || 'Something went wrong.');
        }
      } catch (err) {
        statusEl.textContent = 'Could not send that. Try again in a moment.';
        statusEl.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send suggestion';
      }
    });
  </script>
</body>
</html>
